[workspace]
resolver = "3"
members = ["crates/archiver", "crates/mockarchiver", "crates/archiveview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gilesknap/archiveview"
homepage = "https://gilesknap.github.io/archiveview"
readme = "README.md"

# The crates publish to crates.io together, so the internal dependency carries
# the workspace version as well as its path; CI rewrites both from the tag.
[workspace.dependencies]
archiver = { package = "archiveview-archiver", path = "crates/archiver", version = "0.1.0" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
