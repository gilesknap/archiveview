[workspace]
resolver = "3"
members = ["crates/archiver", "crates/mockarchiver", "crates/archiveview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gilesknap/archiveview"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
