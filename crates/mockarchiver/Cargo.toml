[package]
name = "archiveview-mockarchiver"
description = "A mock EPICS Archiver Appliance serving synthetic PV history, for testing archiveview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mockarchiver"

[[bin]]
name = "archiveview-mockarchiver"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12.0"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
log = "0.4.34"
regex = "1.13.1"

[dev-dependencies]
serde_json = "1.0.154"
