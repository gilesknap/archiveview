[package]
name = "archiveview-archiver"
description = "EPICS Archiver Appliance retrieval client: getData.json, PV search and metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["epics", "archiver", "time-series", "controls"]
categories = ["api-bindings", "science"]

[lib]
name = "archiver"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
log = "0.4.34"

# Blocking HTTP for native builds; a browser build would fetch the URLs that
# `ArchiverClient::*_url` return itself and hand the bodies to `parse_*`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
archiveview-mockarchiver = { path = "../mockarchiver" }
